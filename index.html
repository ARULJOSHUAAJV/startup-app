<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Life OS</title>
    <style>
        :root {
            --bg-color: #f3f4f6;
            --text-color: #1f2937;
            --font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #111827;
                --text-color: #f9fafb;
            }
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: var(--font-family);
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .loader {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(156, 163, 175, 0.3);
            border-top-color: #3b82f6;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="loader">
        <div class="spinner"></div>
        <p>Initializing Personal Life OS...</p>
        <noscript>
            <p style="color: #ef4444;">JavaScript is required to run this offline application.</p>
        </noscript>
    </div>
    <script>
        // PAGE INITIALIZATION
        document.addEventListener('DOMContentLoaded', () => {
            // Simple validation to ensure localStorage/IndexedDB is available
            try {
                const testKey = '__plos_test__';
                localStorage.setItem(testKey, '1');
                localStorage.removeItem(testKey);
                // Redirect to the dashboard
                window.location.replace('./pages/dashboard.html');
            } catch (e) {
                document.querySelector('.loader p').textContent = 'Error: Browser storage is disabled or unavailable.';
                document.querySelector('.spinner').style.display = 'none';
            }
        });
    </script>
</body>
</html>
